@if (loading) {
  <section class="bg-white px-4 py-10 md:px-8">
    <p class="text-center text-sm text-slate-500">Loading partner pharmacies...</p>
  </section>
} @else if (vendors.length > 0) {
  <section class="w-full overflow-hidden bg-white py-12 md:py-14">
    <p class="mb-8 text-center text-sm font-normal uppercase tracking-[0.2em] text-slate-500">
      Our partner pharmacies
    </p>

    <div class="relative w-full overflow-hidden">
      <!-- fade edges -->
      <div
        aria-hidden="true"
        class="pointer-events-none absolute inset-y-0 left-0 z-10 w-20 bg-gradient-to-r from-white to-transparent"
      ></div>
      <div
        aria-hidden="true"
        class="pointer-events-none absolute inset-y-0 right-0 z-10 w-20 bg-gradient-to-l from-white to-transparent"
      ></div>

      <!-- scrolling track -->
      <div class="vendor-marquee-track flex w-max items-center gap-12 px-6 md:gap-16 md:px-10">
        @for (vendor of marqueeItems; track $index) {
          <a
            class="group flex w-40 shrink-0 flex-col items-center gap-3 md:w-44"
            [title]="vendor.businessName"
            [routerLink]="['/']"
          >
            <div
              class="flex h-28 w-28 items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-md transition duration-200 group-hover:border-teal-300 group-hover:shadow-lg md:h-32 md:w-32"
            >
              @if (vendor.profileImage) {
                <img
                  [src]="vendor.profileImage"
                  [alt]="vendor.businessName + ' logo'"
                  class="h-full w-full object-cover"
                />
              } @else {
                <span class="text-3xl font-bold text-teal-700">
                  {{ shopInitial(vendor.businessName) }}
                </span>
              }
            </div>
            <p class="line-clamp-2 w-full text-center text-sm font-semibold text-slate-800">
              {{ vendor.businessName }}
            </p>
          </a>
        }
      </div>
    </div>
  </section>
}
