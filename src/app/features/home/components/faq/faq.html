<section class="relative bg-white">
  <!-- top wave -->
  <div aria-hidden="true" class="relative z-10 leading-none">
    <svg
      class="block h-24 w-full md:h-32"
      preserveAspectRatio="none"
      viewBox="0 0 1440 120"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M0,120 L0,16 Q360,58 720,28 T1440,16 L1440,120 Z" fill="#7FCBC3" />
    </svg>
  </div>

  <div
    class="px-6 py-12 md:px-8 md:py-16"
    style="background: linear-gradient(180deg, #7FCBC3 0%, #4DB6AB 48%, #2f7570 100%);"
  >
    <div class="mx-auto max-w-[1100px]">
      <div class="mb-10 text-center md:mb-12">
        <h2 class="text-2xl font-bold tracking-tight text-white md:text-[2rem]">
          Frequently Asked Questions
        </h2>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 lg:auto-rows-[210px]">
        @for (faq of faqs; track faq.question) {
          <article
            class="group box-border flex h-[210px] w-full flex-col overflow-hidden rounded-2xl border border-white/90 bg-white/10 p-4 shadow-[0_8px_30px_rgba(15,23,42,0.1)] transition duration-300 hover:border-white hover:bg-white/15 hover:shadow-[0_14px_40px_rgba(15,23,42,0.14)]"
          >
            <div
              class="mb-3 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/15 ring-1 ring-white/20 transition group-hover:bg-white/20"
            >
              @switch (faq.icon) {
                @case ('package') {
                  <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25l-9-5.25L3 8.25m18 0l-9 5.25m9-5.25v7.5l-9 5.25m0-12.75L3 8.25m9 5.25v7.5m0-12.75L3 15.75v0" />
                  </svg>
                }
                @case ('clipboard') {
                  <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5.25H7.5A2.25 2.25 0 005.25 7.5v12A2.25 2.25 0 007.5 21.75h9a2.25 2.25 0 002.25-2.25v-12A2.25 2.25 0 0016.5 5.25H15m-6 0V3.75A1.5 1.5 0 0110.5 2.25h3A1.5 1.5 0 0115 3.75V5.25m-6 0h6" />
                  </svg>
                }
                @case ('truck') {
                  <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m0 0V6.375c0-.621.504-1.125 1.125-1.125h9.75c.621 0 1.125.504 1.125 1.125v3.75m0 0h2.25l3 3v3.75a1.125 1.125 0 01-1.125 1.125H18.75m-2.25-7.5v7.5m0 0a1.5 1.5 0 103 0m-3 0a1.5 1.5 0 013 0" />
                  </svg>
                }
                @case ('return') {
                  <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
                  </svg>
                }
                @case ('search') {
                  <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z" />
                  </svg>
                }
                @case ('card') {
                  <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" />
                  </svg>
                }
              }
            </div>

            <h3 class="line-clamp-2 shrink-0 text-[15px] font-bold leading-snug text-white">
              {{ faq.question }}
            </h3>
            <p class="mt-2 line-clamp-4 min-h-0 flex-1 overflow-hidden text-xs leading-5 text-white/90">
              {{ faq.answer }}
            </p>
          </article>
        }
      </div>
    </div>
  </div>

  <!-- bottom wave -->
  <div aria-hidden="true" class="relative z-10 leading-none">
    <svg
      class="block h-24 w-full md:h-32"
      preserveAspectRatio="none"
      viewBox="0 0 1440 120"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M0,0 L1440,0 L1440,16 Q1080,58 720,28 T0,16 Z" fill="#2f7570" />
    </svg>
  </div>
</section>
