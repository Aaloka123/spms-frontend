<section>
  <h2 class="text-2xl font-bold text-slate-900">Dashboard</h2>
  <p class="mt-2 text-sm text-slate-600">Welcome back, {{ username }}.</p>

  @if (loading) {
    <p class="mt-6 text-sm text-slate-500">Loading...</p>
  }

  @if (errorMessage) {
    <p class="mt-6 text-sm text-rose-600">{{ errorMessage }}</p>
  }

  @if (!loading && !errorMessage) {
    <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm text-slate-500">Total Products</p>
        <p class="mt-2 text-3xl font-bold text-teal-700">{{ productCount }}</p>
      </article>

      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm text-slate-500">Admin Account</p>
        <p class="mt-2 text-xl font-bold text-slate-900">1</p>
      </article>
    </div>
  }
</section>
