<div class="min-h-screen bg-slate-50 md:flex">
  <aside class="w-full border-b border-slate-200 bg-white md:w-64 md:border-b-0 md:border-r">
    <div class="px-5 py-5">
      <p class="text-xs font-semibold uppercase tracking-wide text-teal-700">MedNexus</p>
      <h1 class="mt-1 text-lg font-bold text-slate-900">Admin Panel</h1>
      <p class="mt-1 text-sm text-slate-500">Signed in as {{ username }}</p>
    </div>

    <nav class="flex gap-2 overflow-x-auto px-3 pb-4 md:flex-col md:overflow-visible">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-teal-50 text-teal-800"
        class="rounded-xl px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        Dashboard
      </a>
      <a
        routerLink="/products"
        class="rounded-xl px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
      >
        View Store
      </a>
    </nav>

    <div class="border-t border-slate-200 px-3 py-4">
      <button
        type="button"
        class="w-full rounded-xl bg-slate-900 px-3 py-2 text-sm font-semibold text-white"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8">
    <router-outlet />
  </main>
</div>
