<!-- sticky header bar (stays on top while scrolling) -->
<header
  class="sticky top-0 z-50 bg-[#F8FAFC] px-4 py-2.5 shadow-[0_8px_24px_rgba(15,23,42,0.06)] backdrop-blur md:px-8 lg:px-[80px]"
>
  <nav class="flex w-full items-center justify-between gap-3">
    <!-- LOGO: click goes to home -->
    <a routerLink="/" class="inline-flex shrink-0 items-center" (click)="closeMenu()">
      <img
        src="/assets/Mednexux.png"
        alt="MedNexus logo"
        class="h-10 w-auto object-contain sm:h-12"
      />
    </a>

    <!-- DESKTOP NAV: hidden on small screens, shown from lg breakpoint -->
    <div class="hidden items-center gap-1.5 lg:flex">
      <!-- exact: true => Home active only on "/" not on child routes -->
      <a
        routerLink="/"
        routerLinkActive="text-teal-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3.5 py-2 text-[14px] font-medium text-slate-700 transition duration-200 hover:text-teal-700"
      >
        Home
      </a>

      <a
        routerLink="/products"
        routerLinkActive="text-teal-700"
        class="rounded-lg px-3.5 py-2 text-[14px] font-medium text-slate-700 transition duration-200 hover:text-teal-700"
      >
        Product
      </a>

      <a
        routerLink="/about"
        routerLinkActive="text-teal-700"
        class="rounded-lg px-3.5 py-2 text-[14px] font-medium text-slate-700 transition duration-200 hover:text-teal-700"
      >
        About
      </a>

      <a
        routerLink="/contacts"
        routerLinkActive="text-teal-700"
        class="rounded-lg px-3.5 py-2 text-[14px] font-medium text-slate-700 transition duration-200 hover:text-teal-700"
      >
        Contacts
      </a>
    </div>

    <!-- RIGHT SIDE: search + login + hamburger -->
    <div class="flex items-center justify-end gap-2">
      <!-- SEARCH: hidden on phones, shown from md -->
      <div class="relative hidden md:block">
        <!-- decorative search icon (SVG) -->
        <svg
          aria-hidden="true"
          class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
          fill="none"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="m21 21-4.35-4.35m1.85-5.15a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
          />
        </svg>

        <!-- search box (UI only for now, no API yet) -->
        <input
          class="w-40 rounded-full border border-slate-200 bg-slate-50 py-2 pl-9 pr-4 text-[14px] text-slate-700 outline-none transition duration-200 hover:border-slate-300 focus:border-teal-500 focus:bg-white lg:w-52"
          placeholder="Search..."
          type="text"
        />
      </div>

      <!-- LOGIN button (desktop/tablet) -->
      <a
        routerLink="/login"
        (click)="closeMenu()"
        class="hidden rounded-lg border border-transparent bg-gradient-to-br from-teal-600 to-teal-700 px-4 py-2 text-[14px] font-semibold text-white shadow-sm shadow-teal-900/20 transition duration-200 hover:from-teal-700 hover:to-teal-800 sm:inline-flex sm:px-5"
      >
        Login
      </a>

      <!-- HAMBURGER: only on small screens -->
      <button
        type="button"
        class="inline-flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center text-slate-700 transition hover:text-teal-700 lg:hidden"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle menu"
        (click)="toggleMenu()"
      >
        @if (menuOpen) {
          <span class="text-xl font-bold">✕</span>
        } @else {
          <span class="text-xl font-bold">☰</span>
        }
      </button>
    </div>
  </nav>

  <!-- MOBILE DRAWER: show only when menuOpen is true -->
  @if (menuOpen) {
    <!-- dark backdrop behind the drawer -->
    <button
      type="button"
      aria-label="Close menu"
      class="fixed inset-0 z-[200] bg-slate-900/50 lg:hidden"
      (click)="closeMenu()"
    ></button>

    <!-- side panel from the right -->
    <div
      class="fixed inset-y-0 right-0 z-[201] flex h-dvh w-[min(100vw,20rem)] flex-col border-l border-slate-200 bg-[#F8FAFC] shadow-2xl lg:hidden"
    >
      <div class="flex shrink-0 items-center justify-between border-b border-slate-200 px-5 py-4">
        <p class="text-sm font-medium text-teal-700">Menu</p>
        <button
          type="button"
          class="inline-flex h-9 w-9 items-center justify-center text-slate-700 hover:text-teal-700"
          (click)="closeMenu()"
        >
          ✕
        </button>
      </div>

      <div class="min-h-0 flex-1 space-y-1 overflow-y-auto px-5 py-5">
        <!-- each link closes menu after navigation -->
        <a
          routerLink="/"
          routerLinkActive="bg-slate-100"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-[15px] font-medium text-black hover:bg-slate-100"
          (click)="closeMenu()"
        >
          Home
        </a>

        <a
          routerLink="/products"
          routerLinkActive="bg-slate-100"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-[15px] font-medium text-black hover:bg-slate-100"
          (click)="closeMenu()"
        >
          Product
        </a>

        <a
          routerLink="/about"
          routerLinkActive="bg-slate-100"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-[15px] font-medium text-black hover:bg-slate-100"
          (click)="closeMenu()"
        >
          About
        </a>

        <a
          routerLink="/contacts"
          routerLinkActive="bg-slate-100"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-[15px] font-medium text-black hover:bg-slate-100"
          (click)="closeMenu()"
        >
          Contacts
        </a>

        <a
          routerLink="/login"
          class="mt-6 flex w-full items-center justify-center rounded-xl bg-gradient-to-br from-teal-600 to-teal-700 px-5 py-3 text-sm font-semibold text-white"
          (click)="closeMenu()"
        >
          Login
        </a>
      </div>
    </div>
  }
</header>
