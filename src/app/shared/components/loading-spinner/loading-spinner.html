<div
  role="status"
  aria-live="polite"
  class="flex flex-col items-center justify-center gap-3.5 p-6 text-center"
  [class.fixed]="fullScreen"
  [class.inset-0]="fullScreen"
  [class.z-50]="fullScreen"
  [class.bg-slate-900/35]="fullScreen"
  [class.backdrop-blur-md]="fullScreen"
>
  <div class="relative flex items-center justify-center">
    <div
      class="animate-spin rounded-full border-teal-600 border-t-transparent shadow-xs"
      [class.h-7]="size === 'sm'"
      [class.w-7]="size === 'sm'"
      [class.border-2]="size === 'sm'"
      [class.h-11]="size === 'md'"
      [class.w-11]="size === 'md'"
      [class.border-3]="size === 'md'"
      [class.h-16]="size === 'lg'"
      [class.w-16]="size === 'lg'"
      [class.border-4]="size === 'lg'"
    ></div>
    <div
      class="absolute rounded-full bg-teal-500/20 animate-ping"
      [class.h-3]="size === 'sm'"
      [class.w-3]="size === 'sm'"
      [class.h-5]="size === 'md'"
      [class.w-5]="size === 'md'"
      [class.h-8]="size === 'lg'"
      [class.w-8]="size === 'lg'"
    ></div>
    <div
      class="absolute rounded-full bg-teal-600"
      [class.h-2]="size === 'sm'"
      [class.w-2]="size === 'sm'"
      [class.h-2.5]="size === 'md'"
      [class.w-2.5]="size === 'md'"
      [class.h-4]="size === 'lg'"
      [class.w-4]="size === 'lg'"
    ></div>
  </div>

  @if (message) {
    <p class="text-xs font-semibold tracking-wide text-slate-600" [class.text-white]="fullScreen">{{ message }}</p>
  }
  <span class="sr-only">{{ message || 'Loading...' }}</span>
</div>
